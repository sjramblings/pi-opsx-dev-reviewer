<script id="model" type="application/json">{"title":"Architecture description — pi-opsx-dev-reviewer","provenance":{"commit":"55367f8","date":"2026-07-18","corpusTag":"generated-at:2026-05-20T23:55:19.943Z","corpusHash":"sha256:9b9945353ab2f6d14565be4f959b81ee319a93e29d90259442baf3c4f5452bc9"},"crosswalk":[{"section":"1. Introduction and Goals","hld":"Solution overview and objectives","lld":"Not applicable — goals are not a low-level artifact."},{"section":"2. Constraints","hld":"Design constraints and assumptions","lld":"Environment and toolchain constraints"},{"section":"3. Context and Scope","hld":"System context and interfaces","lld":"External interface inventory"},{"section":"4. Solution Strategy","hld":"Architecture approach","lld":"Not applicable — strategy is high-level only."},{"section":"5. Building Block View","hld":"Logical component architecture","lld":"Module and file-level design"},{"section":"6. Runtime View","hld":"Key process flows","lld":"Sequence-level behaviour"},{"section":"7. Deployment View","hld":"Deployment and topology","lld":"Install and configuration detail"},{"section":"8. Crosscutting Concepts","hld":"Cross-cutting design concepts","lld":"Concept implementation detail"},{"section":"9. Architecture Decisions","hld":"Decision log summary","lld":"ADR references"},{"section":"10. Quality Requirements","hld":"Non-functional requirements","lld":"Quality scenarios and evidence"},{"section":"11. Risks and Technical Debt","hld":"Risk register","lld":"Defect and debt detail"},{"section":"12. Glossary","hld":"Glossary","lld":"Glossary"}],"sections":[{"id":"01-introduction-and-goals","num":"01","title":"Introduction and Goals","html":"<p>The kit turns <strong>pi</strong> (a coding agent) into a delegating, self-guarding software factory: a design → implement → review → document pipeline where a read-only main agent delegates to specialist subagents, structural guards fail closed, and review evidence is produced by a neutral party. The whole harness installs into any repository (<code>install.sh:60</code>, <code>install.sh:5</code>).</p>\n<h2>Stakeholders</h2>\n<table><thead><tr><th>Stakeholder</th><th>Architectural expectation</th></tr></thead><tbody><tr><td>Kit maintainer</td><td>The guards actually hold; a broken guard fails loudly rather than silently.</td></tr><tr><td>Operator using the kit in a repo</td><td>One command installs the harness; the change lifecycle is legible via <code>just next</code> (<code>justfile.opsx:389</code>).</td></tr><tr><td>Delegated subagents (developer, reviewer, architect, tech-writer, spec-reviewer, architecture-writer)</td><td>Each has exactly the tools its role needs and no more (<code>agents/reviewer.md:6</code>, <code>agents/developer.md:6</code>).</td></tr><tr><td>Reviewer of a change</td><td>Verdict evidence survives in a durable ledger, not chat scrollback (<code>openspec/schemas/dev-reviewer/schema.yaml:68</code>).</td></tr></tbody></table>\n<p>Concerns: the stakeholder concerns this architecture must address are authorization integrity (a guard cannot be bypassed by prompt), failure visibility (a broken guard is loud, not silent), evidence durability (a verdict survives beyond one session), and portability (the harness installs anywhere by file copy). Each is traced to a quality goal below.</p>\n<h2>Quality goals</h2>\n<p>The three quality attributes that shape the architecture, in priority order:</p>\n<ol><li><strong>Structural safety over convenience.</strong> Authorization is enforced by code and process isolation, not by prompt instructions. A reviewer that must not write is given no write tool (<code>agents/reviewer.md:6</code>); the main agent that must delegate is blocked at the tool call (<code>extensions/force-delegate/index.ts:6</code>).</li><li><strong>Loud failure over silent degradation.</strong> A guard that fails to load halts the session with a banner (<code>extensions/harness-selftest/index.ts:22</code>); a gate that cannot run its tools reports <code>PARTIAL</code>, never a false <code>clean</code> (<code>justfile.opsx:7</code>).</li><li><strong>Portability.</strong> The harness is file-copy installable into any repo with no service dependency (<code>install.sh:66</code>).</li></ol>\n<h2>Requirements overview</h2>\n<p>The functional core is the delegation loop: the main agent is made read-only, so the only way it can change code is to call a subagent (<code>extensions/force-delegate/index.ts:6</code>). The OpenSpec <code>dev-reviewer</code> schema bakes the developer/reviewer contract into the apply step (<code>openspec/schemas/dev-reviewer/schema.yaml:119</code>).</p>"},{"id":"02-constraints","num":"02","title":"Constraints","html":"<h2>Technical constraints</h2>\n<table><thead><tr><th>Constraint</th><th>Evidence</th><th>Consequence for the architecture</th></tr></thead><tbody><tr><td>The pi extension loader has a fragile tokenizer that silently disables a file on a regex literal, a raw backtick, or an apostrophe — even inside comments</td><td><code>extensions/architect-scope/index.ts:17</code></td><td>Every guard is written with <code>new RegExp</code> and string methods, no backticks, no apostrophes; a static scan enforces it (<code>justfile.opsx:245</code>).</td></tr><tr><td>Agent identity is only available through the <code>PI_SUBAGENT_STACK</code> environment variable set by <code>@mjakl/pi-subagent</code></td><td><code>extensions/architect-scope/index.ts:14</code></td><td>Authorization decisions read that variable; an unset or unparseable value is treated as unidentified and restricted.</td></tr><tr><td>Subagents run as child pi processes marked by <code>PI_SUBAGENT_DEPTH</code></td><td><code>extensions/force-delegate/index.ts:15</code></td><td>The delegation guard no-ops inside subagents, so a delegated writer keeps full tools.</td></tr></tbody></table>\n<h2>Toolchain constraints</h2>\n<ul><li><strong>TypeScript and bun only.</strong> Every engine under <code>tools/</code> is TypeScript run by bun (<code>justfile.opsx:36</code>). The one Python dependency is a third-party skill invoked as a subprocess, not owned here (<code>tools/waf-grounding.ts</code> calls <code>python3</code> for the external <code>wa_lookup.py</code>).</li><li><strong>OpenSpec 1.4.1</strong> is the change methodology; the repo carries a custom <code>dev-reviewer</code> schema (<code>openspec/schemas/dev-reviewer/schema.yaml:1</code>).</li></ul>\n<h2>Organizational constraints</h2>\n<ul><li>Work lands on feature branches through pull requests, never directly on <code>main</code>; a guard blocks commit, push, and force-push to protected branches (<code>extensions/branch-guard/index.ts:7</code>).</li><li>A change is not complete until every implemented task has a reviewer verdict recorded in its ledger (<code>openspec/schemas/dev-reviewer/schema.yaml:68</code>).</li></ul>"},{"id":"03-context-and-scope","num":"03","title":"Context and Scope","html":"<h2>Business context</h2>\n<p>The kit sits between an operator and the pi coding agent. The operator drives a change; the kit constrains how pi executes it, so that a single read-only main agent orchestrates specialist subagents under structural guards.</p>\n<h2>External actors and systems</h2>\n<table><thead><tr><th>External entity</th><th>Relationship</th><th>Interface</th></tr></thead><tbody><tr><td><strong>pi coding agent</strong></td><td>Host runtime the kit extends</td><td>Extensions loaded from <code>.pi/extensions/</code>, agents from <code>~/.pi/agent/agents/</code>, prompts from the prompts directory (<code>install.sh:35</code>, <code>install.sh:44</code>).</td></tr><tr><td>**<code>@mjakl/pi-subagent</code>**</td><td>Community extension that adds the <code>subagent</code> tool and sets identity</td><td>Installed by <code>install.sh:33</code>; provides <code>PI_SUBAGENT_STACK</code> / <code>PI_SUBAGENT_DEPTH</code>.</td></tr><tr><td><strong>OpenSpec 1.4.1</strong></td><td>Change-management CLI</td><td>The <code>dev-reviewer</code> schema and <code>just</code> recipes wrap it (<code>justfile.opsx:63</code>).</td></tr><tr><td><strong>aws-well-architected-review skill</strong></td><td>Third-party corpus + Python lookup helper</td><td>Invoked read-only as a subprocess by <code>tools/waf-grounding.ts</code> for architecture-writer grounding.</td></tr><tr><td><strong>Model providers</strong></td><td>Back the agents</td><td>Each agent pins a <code>model:</code> (<code>agents/developer.md:4</code>, <code>agents/reviewer.md:4</code>); cross-family by design (see section 9).</td></tr></tbody></table>\n<h2>Scope</h2>\n<p>In scope: the delegation guards, the agent role definitions, the OpenSpec <code>dev-reviewer</code> schema and its gates, the learning/trust/goal ledgers, and the deterministic engines under <code>tools/</code>.</p>\n<p>Out of scope: the pi runtime itself, the model providers, and the third-party corpus — the kit consumes these but does not own them.</p>"},{"id":"04-solution-strategy","num":"04","title":"Solution Strategy","html":"<p>The architecture rests on a small number of fundamental decisions. Each is stated here with the cost it accepts; the durable records are in section 9.</p>\n<h2>Decision: enforce authorization structurally, not by prompt</h2>\n<p>The main agent is made read-only at the tool-call layer, so the only way it can change code is to delegate to a subagent (<code>extensions/force-delegate/index.ts:6</code>). Roles that must not write are given no write tool (<code>agents/reviewer.md:6</code>). Consequence: the delegation guarantee holds even when a model ignores its instructions, but every code change pays a subprocess spawn, and a read-only reviewer physically cannot run a test or a build — its evidence is inspection, not execution.</p>\n<h2>Decision: fail closed on unknown identity</h2>\n<p>The path gate treats an unidentified, empty, or unparseable agent identity as unsafe and restricts it, rather than assuming safety (<code>extensions/architect-scope/index.ts:38</code>). Consequence: a future change to how identity is populated fails to blocked, not to unrestricted write — but the same strictness once blocked a legitimate writer under a symlinked repository root until the path was resolved through <code>realpathSync</code> (<code>extensions/architect-scope/index.ts:128</code>).</p>\n<h2>Decision: review across model families</h2>\n<p>Review runs cross-family, per ADR 0001. Consequence: the accepted trade-off is configuring two model providers, in exchange for catching correlated blind spots. See section 9 for the record.</p>\n<h2>Decision: separate the architecture writer from the technical writer</h2>\n<p>Architecture documentation has a dedicated owner, per ADR 0002. Consequence: the accepted trade-off is a sixth agent and a second documentation gate, in exchange for one owner per artifact and an intact Diátaxis discipline. See section 9 for the record.</p>"},{"id":"05-building-block-view","num":"05","title":"Building Block View","html":"<p>Detail stops at the container and component level; source structure is not mirrored here.</p>\n<h2>Level 1 — system context</h2>\n<p>The kit is one system installed into a host repository. It comprises four containers: the <strong>agent role set</strong> (<code>agents/</code>), the <strong>guard extensions</strong> (<code>extensions/</code>), the <strong>deterministic engines</strong> (<code>tools/</code>), and the <strong>OpenSpec dev-reviewer schema and recipes</strong> (<code>openspec/schemas/dev-reviewer/</code>, <code>justfile.opsx</code>).</p>\n<h2>Level 2 — containers</h2>\n<h3>Agent role set (<code>agents/</code>)</h3>\n<p>Six single-file agent definitions, each with <code>name</code>, <code>model</code>, and <code>tools</code> frontmatter: <code>architecture-writer</code> (<code>agents/architecture-writer.md:2</code>), <code>developer</code> (<code>agents/developer.md:2</code>), <code>reviewer</code> (<code>agents/reviewer.md:2</code>), <code>solution-architect</code> (<code>agents/solution-architect.md:2</code>), <code>spec-reviewer</code> (<code>agents/spec-reviewer.md:2</code>), and <code>tech-writer</code> (<code>agents/tech-writer.md:2</code>). Write-capable agents carry <code>tools: read,grep,find,ls,edit,write,bash</code>; the two review roles drop <code>edit</code>/<code>write</code>/<code>bash</code> (<code>agents/reviewer.md:6</code>, <code>agents/spec-reviewer.md:6</code>).</p>\n<h3>Guard extensions (<code>extensions/</code>)</h3>\n<ul><li><strong>force-delegate</strong> — makes the main agent read-only and no-ops inside subagents (<code>extensions/force-delegate/index.ts:15</code>).</li><li><strong>architect-scope</strong> — per-agent write-path policy, fail-closed (<code>extensions/architect-scope/index.ts:45</code>).</li><li><strong>harness-selftest</strong> — session-start canary that halts if force-delegate did not load (<code>extensions/harness-selftest/index.ts:28</code>).</li><li><strong>developer-guard</strong> — blocks catastrophic bash on write-capable subagents (<code>extensions/developer-guard/index.ts:23</code>).</li><li><strong>branch-guard</strong> — blocks commit/push/force-push to protected branches (<code>extensions/branch-guard/index.ts:7</code>).</li><li><strong>lib/tool-events.ts</strong> — shared append of every blocked call to a JSONL audit trail.</li></ul>\n<h3>Deterministic engines (<code>tools/</code>)</h3>\n<p>TypeScript engines run by bun: <code>arch-lint.ts</code> (the architecture gate, 1015 lines), <code>waf-grounding.ts</code> (corpus resolution, 816 lines), <code>pylib.ts</code> (CPython-semantics helpers shared by the two), plus <code>select-learnings.ts</code>, <code>audit-learnings.ts</code>, <code>trust.ts</code>, <code>verify-goals.ts</code>, <code>session-cost.ts</code>, and <code>assess-tool-events.ts</code>.</p>\n<h3>OpenSpec dev-reviewer schema and recipes</h3>\n<p>The <code>dev-reviewer</code> schema declares eight artifacts including <code>review-report</code> (<code>openspec/schemas/dev-reviewer/schema.yaml:68</code>), <code>architecture</code> (<code>openspec/schemas/dev-reviewer/schema.yaml:80</code>), and <code>docs</code> (<code>openspec/schemas/dev-reviewer/schema.yaml:99</code>), and bakes delegation into the apply step (<code>openspec/schemas/dev-reviewer/schema.yaml:119</code>). The <code>justfile.opsx</code> recipe suite provides the gates: <code>docs-lint:7</code>, <code>arch-lint:44</code>, <code>archive-check:63</code>, <code>check-extensions:245</code>, <code>verify-gate:285</code>.</p>"},{"id":"06-runtime-view","num":"06","title":"Runtime View","html":"<h2>Scenario 1 — a change is applied through delegation</h2>\n<ol><li>The operator runs the apply flow against an OpenSpec change. The main agent is read-only under force-delegate (<code>extensions/force-delegate/index.ts:6</code>), so it cannot edit code directly.</li><li>For each pending task it delegates implementation to the <code>developer</code> subagent, then sends the raw diff to the <code>reviewer</code> subagent, quarantining the developer&#39;s narrative as untrusted (<code>openspec/schemas/dev-reviewer/schema.yaml:119</code>).</li><li>The developer appends the reviewer&#39;s verdict verbatim to <code>review-log.md</code> before ticking the task (<code>openspec/schemas/dev-reviewer/schema.yaml:68</code>).</li><li>After the last task, the architecture and docs artifacts are delegated, then <code>just archive-check</code> runs (<code>justfile.opsx:63</code>).</li></ol>\n<h2>Scenario 2 — session start canary</h2>\n<p>On <code>session_start</code>, harness-selftest reads the handshake flag force-delegate sets when it loads (<code>extensions/harness-selftest/index.ts:10</code>). If the flag is absent, it emits the halt banner (<code>extensions/harness-selftest/index.ts:22</code>) — turning a silent enforcer-load failure into a loud stop.</p>\n<h2>Scenario 3 — a write is authorized</h2>\n<p>On a <code>write</code> or <code>edit</code> tool call, architect-scope resolves the current agent from <code>PI_SUBAGENT_STACK</code>. An open writer passes; a scoped agent is checked against its path policy; the architect and any unidentified agent are restricted to design artifacts; an unparseable target is blocked (<code>extensions/architect-scope/index.ts:45</code>). Absolute paths are resolved through the filesystem before the prefix comparison so a symlinked root does not cause a false block (<code>extensions/architect-scope/index.ts:128</code>).</p>\n<h2>Scenario 4 — the architecture gate runs</h2>\n<p><code>just arch-lint</code> checks stated cost, best-practice identifier resolution, evidence for met claims, ADR existence, section completeness, and the 42010 checklist, reporting <code>FAIL</code>, <code>PARTIAL</code>, <code>clean</code>, or <code>not-found</code> (<code>justfile.opsx:44</code>, <code>tools/arch-lint.ts</code>).</p>"},{"id":"07-deployment-view","num":"07","title":"Deployment View","html":"<p>There is no server and no hosted environment. The kit is a set of files copied into two locations on an operator&#39;s machine.</p>\n<h2>Topology</h2>\n<table><thead><tr><th>Target</th><th>Contents</th><th>Evidence</th></tr></thead><tbody><tr><td><code>~/.pi/agent/agents/</code> and the prompts directory (global)</td><td>Six agent files and five prompt templates</td><td><code>install.sh:35</code>, <code>install.sh:44</code></td></tr><tr><td><code>&lt;repo&gt;/.pi/extensions/</code> (per repository)</td><td>All guard extensions</td><td><code>install.sh:66</code></td></tr><tr><td><code>&lt;repo&gt;/tools/</code></td><td>The deterministic engines</td><td><code>install.sh:71</code></td></tr><tr><td><code>&lt;repo&gt;/openspec/schemas/dev-reviewer/</code></td><td>The custom schema (only if the repo has no other schema)</td><td><code>install.sh:77</code> region</td></tr><tr><td><code>&lt;repo&gt;/justfile.opsx</code> + import</td><td>The recipe suite</td><td>Appended to the host justfile without overwrite</td></tr></tbody></table>\n<h2>Install modes</h2>\n<p><code>install.sh</code> supports <code>--here</code> (project pieces into a repo), no-argument global install, and <code>--all</code> (<code>install.sh:5</code>, <code>install.sh:8</code>). The global path also installs <code>@mjakl/pi-subagent</code> and runs a model sanity check (<code>install.sh:33</code>, <code>install.sh:51</code>).</p>\n<h2>Operations</h2>\n<p>Runtime state — the trust ledger, goal ledger, and tool-events audit — is generated under <code>memory/</code> and is gitignored, never committed. Guard load-health is verified in place at install time via <code>just check-extensions</code> (<code>justfile.opsx:245</code>).</p>"},{"id":"08-crosscutting-concepts","num":"08","title":"Crosscutting Concepts","html":"<p>Each pattern below names its catalogue, the repository location that instantiates it, and at least one consequence the system accepts by using it.</p>\n<h2>Pattern: Fail-safe defaults (default-deny authorization)</h2>\n<p>Catalogue: Saltzer and Schroeder, <em>The Protection of Information in Computer Systems</em> (fail-safe defaults). Instantiated in the path gate, which restricts any unidentified agent rather than allowing it (<code>extensions/architect-scope/index.ts:38</code>) and in the bash gate, which blocks a command it cannot parse with confidence (<code>extensions/force-delegate/index.ts:13</code>). Consequence: the system accepts that legitimate-but-unrecognized actions are blocked — a symlinked repository root once blocked a valid write until the path resolution fix (<code>extensions/architect-scope/index.ts:128</code>), and an unparseable-but-harmless bash command is refused.</p>\n<h2>Pattern: Least privilege via process isolation</h2>\n<p>Catalogue: Saltzer and Schroeder (least privilege). Instantiated by giving each agent only the tools its role needs — the review roles hold no write or bash tool (<code>agents/reviewer.md:6</code>, <code>agents/spec-reviewer.md:6</code>) — enforced by separate pi processes per subagent (<code>extensions/force-delegate/index.ts:15</code>). Consequence: the system accepts a per-delegation process-spawn cost, and a read-only reviewer cannot execute a test or build, so its verdict rests on inspection rather than running the code.</p>\n<h2>Pattern: Dead-man&#39;s-switch canary</h2>\n<p>Catalogue: fail-fast health-check (release-engineering canary). Instantiated by harness-selftest, which halts the session when the force-delegate load handshake is absent (<code>extensions/harness-selftest/index.ts:28</code>). Consequence: the system accepts that startup depends on an environment handshake — a false negative in the handshake would halt an otherwise healthy session.</p>\n<h2>Pattern: Append-only ledger (ratchet)</h2>\n<p>Catalogue: event sourcing / append-only log. Instantiated by the review-report artifact, where each verdict is appended before a task is ticked (<code>openspec/schemas/dev-reviewer/schema.yaml:68</code>), and by the shared tool-events audit trail. Consequence: the system accepts that a ledger can go stale relative to the code it records — an attested probe output drifted from the current tool behaviour and had to be flagged for re-attestation.</p>\n<h2>Pattern: Three-state graceful-skip gate</h2>\n<p>Catalogue: house convention (no external catalogue). Instantiated by the lint gates, which report <code>FAIL</code>, <code>PARTIAL</code>, or <code>clean</code>, and report <code>clean</code> only when every tool ran (<code>justfile.opsx:7</code>, <code>justfile.opsx:44</code>). Consequence: the accepted trade-off is that a machine which omits the gate tools reports <code>PARTIAL</code> rather than <code>clean</code>, so a local run yields a weaker signal than CI.</p>"},{"id":"09-architecture-decisions","num":"09","title":"Architecture Decisions","html":"<p>This section indexes the architecture decision records under <code>docs/decisions/</code>. It does not restate their content or invent rationale; read each ADR for the full context, options, and consequences.</p>\n<table><thead><tr><th>ADR</th><th>Title</th><th>Status</th><th>Link</th></tr></thead><tbody><tr><td>0001</td><td>Run the reviewer on a different model family from the developer</td><td>accepted</td><td><code>docs/decisions/0001-cross-family-reviewer.md</code></td></tr><tr><td>0002</td><td>Generate architecture documentation with a separate agent rather than extending the tech-writer</td><td>accepted</td><td><code>docs/decisions/0002-architecture-writer-agent.md</code></td></tr></tbody></table>\n<p>ADR 0001 records why review runs cross-family: a same-family reviewer shares the developer&#39;s training corpus and therefore its blind spots. ADR 0002 records why architecture documentation is owned by a dedicated <code>architecture-writer</code> rather than folded into the <code>tech-writer</code> — Diátaxis models four modes, an architecture description is a fifth shape, and the schema declares one owner per artifact.</p>\n<p>Debt for architecturally significant choices that lack an ADR is recorded in section 11, not here.</p>"},{"id":"10-quality-requirements","num":"10","title":"Quality Requirements","html":"<h2>Quality scenarios</h2>\n<table><thead><tr><th>Quality attribute</th><th>Scenario</th><th>Evidence that it is met</th></tr></thead><tbody><tr><td>Security (authorization)</td><td>The main agent attempts a direct write; the write is refused and delegation is forced</td><td><code>extensions/force-delegate/index.ts:6</code></td></tr><tr><td>Security (fail-closed)</td><td>Agent identity is unset or unparseable; the write is restricted, not allowed</td><td><code>extensions/architect-scope/index.ts:38</code></td></tr><tr><td>Reliability (loud failure)</td><td>A guard fails to load; the session halts with a banner instead of running unguarded</td><td><code>extensions/harness-selftest/index.ts:22</code></td></tr><tr><td>Reliability (no false pass)</td><td>A gate tool is missing; the gate reports <code>PARTIAL</code>, never <code>clean</code></td><td><code>justfile.opsx:7</code></td></tr><tr><td>Testability</td><td>The path guard is covered by unit tests, including the symlinked-root regression</td><td><code>extensions/architect-scope/index.test.ts</code></td></tr><tr><td>Portability</td><td>The harness installs into any repository by file copy with no service dependency</td><td><code>install.sh:66</code></td></tr><tr><td>Integrity</td><td>Extension load-health is statically verified so a tokenizer breaker cannot ship silently</td><td><code>justfile.opsx:245</code></td></tr></tbody></table>\n<h2>AWS Well-Architected assessment</h2>\n<p>AWS Well-Architected best-practice assessment targets a <strong>deployed AWS workload</strong>. This repository is a local developer tool with no deployed AWS surface — no accounts, no infrastructure, no runtime resources — so a per-best-practice Well-Architected review is out of scope, and no best practice is claimed met or unmet here. Forcing AWS best-practice claims onto a local tool would be fabricated attribution.</p>\n<p>The repository does <strong>ship</strong> Well-Architected tooling for consumers: <code>tools/waf-grounding.ts</code> resolves best practices from a pinned corpus, and the architecture-writer uses it to ground quality claims when documenting an AWS workload. The corpus provenance is recorded in the index (<code>docs/architecture/README.md</code>): tag <code>generated-at:2026-05-20T23:55:19.943Z</code>, content hash <code>sha256:9b9945353ab2f6d14565be4f959b81ee319a93e29d90259442baf3c4f5452bc9</code>, 306 best practices. That provenance is a fact about the shipped tool, not a claim about this repository&#39;s own architecture.</p>"},{"id":"11-risks-and-technical-debt","num":"11","title":"Risks and Technical Debt","html":"<h2>Known risks</h2>\n<table><thead><tr><th>Risk</th><th>Evidence</th><th>Mitigation</th></tr></thead><tbody><tr><td>A read-only reviewer cannot run tests or probes, so a verdict can rest on the developer&#39;s unverified narrative</td><td><code>agents/reviewer.md:6</code></td><td>An independent audit re-ran the gates and reopened four verdicts that did not survive (<code>openspec/changes/add-architecture-writer/review-log.md</code>). The structural fix — an attested-probe channel the reviewer can verify — is still open.</td></tr><tr><td>The pi tokenizer silently disables a guard on a stray regex literal, backtick, or apostrophe</td><td><code>extensions/architect-scope/index.ts:17</code></td><td>Static scan <code>just check-extensions</code> (<code>justfile.opsx:245</code>) plus the session-start canary (<code>extensions/harness-selftest/index.ts:28</code>).</td></tr><tr><td>The docs lint gate has never run to green and is not wired into CI</td><td><code>justfile.opsx:7</code></td><td>Tracked as a separate change (<code>fix-spec-template-lint</code>) that settles the lint floor and adds CI.</td></tr><tr><td>An attested probe output can drift from current tool behaviour</td><td><code>openspec/changes/add-architecture-writer/probes/task-4.1-arch-lint-regression.out</code></td><td>Flagged for re-attestation in the review ledger before archive.</td></tr></tbody></table>\n<h2>Technical debt</h2>\n<ul><li><strong>Third-party Python dependency.</strong> <code>tools/waf-grounding.ts</code> invokes an external <code>wa_lookup.py</code> as a subprocess. The kit is otherwise TypeScript-only; this crosses the house language rule but is a third-party skill the kit does not own.</li><li><strong>Documentation gate backlog.</strong> The markdownlint floor fires on rules that were inherited rather than chosen, producing a large backlog that predates this tree.</li></ul>\n<h2>Decision debt</h2>\n<p>Architecturally significant choices in the code with no dedicated ADR:</p>\n<ul><li><strong>Fail-closed authorization model</strong> (<code>extensions/architect-scope/index.ts:38</code>) — a load-bearing security decision recorded only in code comments and the extension spec, with no standalone ADR.</li><li><strong>Three-state graceful-skip gate contract</strong> (<code>justfile.opsx:7</code>) — the <code>FAIL</code>/<code>PARTIAL</code>/ <code>clean</code> convention is applied across every gate but has no ADR stating why <code>PARTIAL</code> must never collapse to a pass.</li></ul>\n<p>These are recorded as debt, not reconstructed rationale; authoring the ADRs belongs to the <code>solution-architect</code>, not to this document.</p>"},{"id":"12-glossary","num":"12","title":"Glossary","html":"<table><thead><tr><th>Term</th><th>Meaning</th></tr></thead><tbody><tr><td>Agent</td><td>A single-file role definition under <code>agents/</code> with <code>name</code>, <code>model</code>, and <code>tools</code>, run by pi as an isolated process.</td></tr><tr><td>arc42</td><td>The twelve-section architecture documentation template this tree follows.</td></tr><tr><td>ADR</td><td>Architecture Decision Record — a durable record of one decision under <code>docs/decisions/</code>, in MADR form.</td></tr><tr><td>Decision debt</td><td>An architecturally significant choice present in the code with no matching ADR, recorded in section 11.</td></tr><tr><td>Fail closed</td><td>An authorization default that blocks on uncertainty rather than allowing (<code>extensions/architect-scope/index.ts:38</code>).</td></tr><tr><td>Guard / extension</td><td>A pi extension under <code>extensions/</code> that constrains tool calls at runtime.</td></tr><tr><td>Open writer</td><td>An agent allowed to write anywhere: <code>developer</code> and <code>tech-writer</code> (<code>extensions/architect-scope/index.ts:45</code>).</td></tr><tr><td>Scoped agent</td><td>An agent restricted to a named path allowlist, e.g. <code>architecture-writer</code> to <code>docs/architecture/</code> (<code>extensions/architect-scope/index.ts:46</code>).</td></tr><tr><td>Ledger / review-report</td><td>The append-only record of reviewer verdicts for a change (<code>openspec/schemas/dev-reviewer/schema.yaml:68</code>).</td></tr><tr><td>OpenSpec</td><td>The change-management methodology (version 1.4.1) the kit wraps with a custom <code>dev-reviewer</code> schema.</td></tr><tr><td>PI_SUBAGENT_STACK</td><td>The environment variable, set by <code>@mjakl/pi-subagent</code>, whose last element is the running agent&#39;s name.</td></tr><tr><td>Three-state gate</td><td>A gate that reports <code>FAIL</code>, <code>PARTIAL</code>, or <code>clean</code> and never a false clean (<code>justfile.opsx:7</code>).</td></tr><tr><td>WAF corpus</td><td>The pinned AWS Well-Architected best-practice corpus consumed by <code>tools/waf-grounding.ts</code>.</td></tr></tbody></table>"}]}</script>
<style>
/* Shared theme tokens — inlined at build time by both the evolution-timeline and
   architecture HTML templates, so the two outputs read as one system. Design tokens
   only (colours, fonts, radii, light/dark palettes); component CSS stays per-template.
   Edit here to change both outputs. */
:root {
  --ground: #F7F9FB;
  --panel: #FFFFFF;
  --panel-2: #EEF2F7;
  --ink: #131A24;
  --ink-2: #48566B;
  --ink-3: #8792A6;
  --rule: #DBE3ED;
  --accent: #2F4DDE;
  --accent-soft: #E6EAFC;
  --landed: #1F9D6B;
  --flight: #C98A16;
  --shadow: 0 1px 2px rgba(19, 26, 36, .06), 0 8px 24px rgba(19, 26, 36, .06);

  --display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

  --wrap: 1120px;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #101720; --panel: #16202C; --panel-2: #1D2937;
    --ink: #E8EDF4; --ink-2: #A3B0C2; --ink-3: #6F7E93;
    --rule: #26333F; --accent: #7C90F5; --accent-soft: #1E2A4D;
    --landed: #3FBF8B; --flight: #E0A93A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --ground: #101720; --panel: #16202C; --panel-2: #1D2937;
  --ink: #E8EDF4; --ink-2: #A3B0C2; --ink-3: #6F7E93;
  --rule: #26333F; --accent: #7C90F5; --accent-soft: #1E2A4D;
  --landed: #3FBF8B; --flight: #E0A93A;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
}
:root[data-theme="light"] {
  --ground: #F7F9FB; --panel: #FFFFFF; --panel-2: #EEF2F7;
  --ink: #131A24; --ink-2: #48566B; --ink-3: #8792A6;
  --rule: #DBE3ED; --accent: #2F4DDE; --accent-soft: #E6EAFC;
  --landed: #1F9D6B; --flight: #C98A16;
  --shadow: 0 1px 2px rgba(19, 26, 36, .06), 0 8px 24px rgba(19, 26, 36, .06);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code { font-family: var(--mono); font-size: .88em; background: var(--panel-2);
  padding: .1em .35em; border-radius: 4px; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 24px; }

.mast { border-bottom: 1px solid var(--rule); background: var(--panel); }
.mast .wrap { display: flex; align-items: flex-start; justify-content: space-between;
  gap: 24px; padding-top: 40px; padding-bottom: 32px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-3); }
h1.title { font-family: var(--display); font-weight: 600; font-size: 34px;
  line-height: 1.15; margin: 8px 0 14px; letter-spacing: -.01em; }
.prov { font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 18px; }
.prov b { color: var(--ink); font-weight: 600; }
.themer { font-family: var(--body); font-size: 13px; color: var(--ink-2);
  background: var(--panel-2); border: 1px solid var(--rule); border-radius: var(--r);
  padding: 8px 14px; cursor: pointer; white-space: nowrap; }
.themer:hover { color: var(--ink); }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
  padding: 28px 0 8px; }
.stat { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r);
  padding: 16px 18px; box-shadow: var(--shadow); }
.stat .n { font-family: var(--display); font-size: 30px; font-weight: 600; }
.stat .n.ok { color: var(--landed); }
.stat .l { font-size: 12px; color: var(--ink-3); text-transform: uppercase;
  letter-spacing: .06em; margin-top: 2px; }

.layout { display: grid; grid-template-columns: 216px 1fr; gap: 40px;
  padding: 28px 0 80px; align-items: start; }
nav.toc { position: sticky; top: 20px; font-size: 14px; }
nav.toc a { display: block; color: var(--ink-2); padding: 5px 10px; border-radius: 6px;
  border-left: 2px solid transparent; }
nav.toc a:hover { background: var(--panel-2); text-decoration: none; }
nav.toc a.active { color: var(--ink); border-left-color: var(--accent);
  background: var(--accent-soft); }
nav.toc .n { color: var(--ink-3); font-family: var(--mono); font-size: 12px;
  margin-right: 6px; }

main { min-width: 0; }
section.sec { scroll-margin-top: 16px; padding-bottom: 34px; margin-bottom: 34px;
  border-bottom: 1px solid var(--rule); }
section.sec:last-child { border-bottom: 0; }
section.sec h2 { font-family: var(--display); font-weight: 600; font-size: 25px;
  letter-spacing: -.01em; margin: 0 0 16px; }
section.sec h2 .n { color: var(--ink-3); font-family: var(--mono); font-size: 16px;
  margin-right: 10px; }
main h3 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 24px 0 8px; }
main p { margin: 0 0 14px; }
main ul, main ol { margin: 0 0 14px; padding-left: 24px; }
main li { margin: 4px 0; }
main table { width: 100%; border-collapse: collapse; margin: 4px 0 20px; font-size: 14px;
  display: block; overflow-x: auto; }
main th, main td { text-align: left; vertical-align: top; padding: 9px 12px;
  border-bottom: 1px solid var(--rule); }
main th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--ink-3); font-weight: 600; white-space: nowrap; }
main tbody tr:hover { background: var(--panel-2); }

.crosswalk { background: var(--panel); border: 1px solid var(--rule);
  border-radius: var(--r); padding: 20px 22px; margin: 8px 0 0; box-shadow: var(--shadow); }
.crosswalk h2 { font-family: var(--display); font-size: 20px; font-weight: 600; margin: 0 0 12px; }

.foot { border-top: 1px solid var(--rule); color: var(--ink-3); font-size: 13px;
  padding: 22px 0 40px; }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  nav.toc { position: static; display: flex; flex-wrap: wrap; gap: 4px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .mast .wrap { flex-direction: column; }
}
</style>
</head>
<body>
<header class="mast">
  <div class="wrap">
    <div>
      <span class="eyebrow">architecture description &middot; arc42</span>
      <h1 class="title" id="title"></h1>
      <div class="prov" id="prov"></div>
    </div>
    <button class="themer" id="themer" type="button">Theme</button>
  </div>
</header>

<div class="wrap">
  <section class="stats" id="stats"></section>
  <div class="layout">
    <nav class="toc" id="toc" aria-label="Sections"></nav>
    <main id="main"></main>
  </div>
  <footer class="foot">
    Rendered from the <code>docs/architecture/</code> markdown tree. Markdown is the source of
    truth and the <code>arch-lint</code> gate target; this page is a derived render.
  </footer>
</div>

<script>
const M = JSON.parse(document.getElementById("model").textContent);
const $ = (s) => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c;
  if (h != null) n.innerHTML = h; return n; };

/* theme toggle (mirrors the evolution timeline) */
(function () {
  const root = document.documentElement;
  $("#themer").addEventListener("click", () => {
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = root.getAttribute("data-theme") || (dark ? "dark" : "light");
    root.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
  });
})();

/* masthead */
$("#title").textContent = M.title;
const p = M.provenance || {};
const provBits = [
  p.commit ? `<span><b>commit</b> ${p.commit}</span>` : "",
  p.date ? `<span><b>generated</b> ${p.date}</span>` : "",
  p.corpusTag ? `<span><b>WAF corpus</b> ${p.corpusTag}</span>` : "",
].filter(Boolean).join("");
$("#prov").innerHTML = provBits;

/* stats: derive from the model, never assert */
const adrCount = ((M.sections.find((s) => s.num === "09") || {}).html || "")
  .match(/\b0\d{3}\b/g);
const adrs = adrCount ? new Set(adrCount).size : 0;
const debt = (((M.sections.find((s) => s.num === "11") || {}).html || "")
  .match(/decision debt/gi) || []).length;
const stats = [
  { n: String(M.sections.length), l: "arc42 sections" },
  { n: String(adrs), l: "ADRs indexed" },
  { n: String(M.crosswalk.length), l: "HLD/LLD rows" },
  { n: "clean", l: "arch-lint gate", ok: true },
];
$("#stats").append(...stats.map((s) =>
  el("div", "stat", `<div class="n${s.ok ? " ok" : ""}">${s.n}</div><div class="l">${s.l}</div>`)));

/* nav + sections */
const toc = $("#toc"), main = $("#main");
for (const s of M.sections) {
  const a = el("a", null, `<span class="n">${s.num}</span>${s.title}`);
  a.href = "#sec-" + s.id;
  toc.append(a);
  const sec = el("section", "sec");
  sec.id = "sec-" + s.id;
  sec.append(el("h2", null, `<span class="n">${s.num}</span>${s.title}`));
  sec.append(el("div", null, s.html));
  main.append(sec);
}

/* crosswalk block appended after the sections */
if (M.crosswalk.length) {
  const cw = el("div", "crosswalk");
  cw.append(el("h2", null, "HLD / LLD crosswalk"));
  const rows = M.crosswalk.map((r) =>
    `<tr><td>${r.section}</td><td>${r.hld}</td><td>${r.lld}</td></tr>`).join("");
  cw.append(el("div", null,
    `<table><thead><tr><th>arc42 section</th><th>High-level design</th><th>Low-level design</th></tr></thead><tbody>${rows}</tbody></table>`));
  main.append(cw);
}

/* scroll-spy: highlight the active section in the nav */
const links = [...toc.querySelectorAll("a")];
const byId = new Map(links.map((a) => [a.getAttribute("href").slice(1), a]));
const obs = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (e.isIntersecting) {
      links.forEach((a) => a.classList.remove("active"));
      const a = byId.get(e.target.id);
      if (a) a.classList.add("active");
    }
  }
}, { rootMargin: "-10% 0px -80% 0px" });
document.querySelectorAll("section.sec").forEach((s) => obs.observe(s));
</script>
</body>
</html>
