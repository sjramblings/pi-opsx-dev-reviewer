StylesPath = styles

MinAlertLevel = suggestion

# The Google + write-good packages are pulled by `just docs-lint-setup`
# (vale sync). The DevReviewer style ships in-repo and needs no download.
Packages = Google, write-good

[*.md]
BasedOnStyles = Vale, DevReviewer, Google, write-good

# Don't lint fenced code or inline code as prose.
BlockIgnores = (?s) *(```.*?```)
TokenIgnores = (\x60[^\n\x60]+\x60)
