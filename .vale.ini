StylesPath = styles

MinAlertLevel = suggestion
Vocab = DevReviewer

# The Google + write-good packages are pulled by `just docs-lint-setup`
# (vale sync). The DevReviewer style ships in-repo and needs no download.
Packages = Google, write-good

[*.md]
BasedOnStyles = Vale, DevReviewer, Google, write-good
# Preserve this repository's established dash, abbreviation, and quoted-punctuation style.
Google.EmDash = NO
Google.Latin = NO
Google.Quotes = NO

# OpenSpec task ledgers contain command output and probe grammar rather than user-facing prose.
[**/tasks.md]
Google.OptionalPlurals = NO
write-good.So = NO
# Change slugs are lowercase identifiers, not prose.
Vale.Terms = NO

# This settled design is an input contract for task 5.1; its prose remains architect-owned.
[openspec/changes/add-orchestrator-bookkeeping/design.md]
DevReviewer.BannedTells = NO
write-good.So = NO

# Archived changes are frozen historical records. Editing them to satisfy a style rule would
# rewrite history, and archival must not resurrect exceptions that were scoped to a live path.
[openspec/changes/archive/**]
BasedOnStyles =

# Reviewer verdicts are generated evidence and must remain byte-identical.
[openspec/changes/**/review-log.md]
BasedOnStyles =

[styles/Google/**]
BasedOnStyles =

[styles/write-good/**]
BasedOnStyles =

# Don't lint fenced code or inline code as prose.
BlockIgnores = (?s) *(```.*?```)
TokenIgnores = (\x60[^\n\x60]+\x60)
